[package]
name = "pdf-concater"
version = "0.1.0"
license = "MIT"
authors = ["Sushi Dev GmbH"]
homepage = "https://sushi.dev"
edition = "2024"
repository = "https://github.com/sushidev-team/php-pdf-concater"
publish = false

[workspace]
members = ["php-ext"]
default-members = ["."]
resolver = "3"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
lopdf = { version = "0.46", default-features = false }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1

