name: Attach release binaries

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach binaries to
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-binaries-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  binaries:
    uses: ./.github/workflows/build-binaries.yml
    with:
      ref: ${{ inputs.tag || github.event.release.tag_name }}
      tag: ${{ inputs.tag || github.event.release.tag_name }}

  upload:
    name: Verify checksums and attach all four builds
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: assets
          merge-multiple: true
      - name: Verify complete artifact set
        working-directory: assets
        run: |
          test "$(find . -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 4
          test "$(find . -maxdepth 1 -name '*.sha256' | wc -l)" -eq 4
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl x86_64-apple-darwin aarch64-apple-darwin; do
            test -f "pdf-concater-$RELEASE_TAG-$target.tar.gz"
          done
          cat ./*.sha256 > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Upload assets to existing release
        run: |
          gh release view "$RELEASE_TAG" --repo "$GH_REPO"
          gh release upload "$RELEASE_TAG" assets/*.tar.gz assets/SHA256SUMS --clobber --repo "$GH_REPO"
