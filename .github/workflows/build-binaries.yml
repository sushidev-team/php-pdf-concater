name: Build executable binaries

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      tag:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    defaults:
      run:
        shell: bash
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install musl compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build release executable
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET" -p pdf-concater
      - name: Package and exercise extracted executable
        env:
          TARGET: ${{ matrix.target }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: >-
          python3 scripts/package-binary.py
          --binary "target/$TARGET/release/pdf-concater"
          --target "$TARGET" --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: output/binaries/*
          if-no-files-found: error
          retention-days: 14
